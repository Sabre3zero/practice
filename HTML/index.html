<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>"Книжный червь"</title>
  <link rel="stylesheet" href="../CSS/style.css">
  <script src="../JS/script.js" defer></script>
</head>

<body>

  <header class="site-header">
    <div class="container">
      <p class="brand">Веб-клуб</p>
      <nav aria-label="Основная навигация">
        <a href="#topics">Книги</a>
        <a href="#contacts">Контакты</a>
      </nav>
    </div>
  </header>

  <main class="container">

    <section class="intro">
      <h1>Читвем книги</h1>
      <p>Читаем, общаемся, развиваемся</p>
      <a class="button" href="#topics">Посмотреть книги</a>
    </section>

    <section id="topics">
      <h2>Книги</h2>
      <label for="category-filter">Категория тем</label> 

      <select id="category-filter"> 
        <option value="all">Все темы</option> 
        <option value="dystopian">Антиутопия</option> 
        <option value="novel">Роман</option> 
      </select> 

      <p id="topic-count" role="status"></p> 
      <div id="topic-list" class="cards"></div> 
      <noscript>Для вывода тем включите JavaScript.</noscript> 
    </section>

    <section id="contacts" class="contacts">
      <h2>Как присоединиться</h2>
      <p>Приходите в кабинет 413 после занятий.</p>
    </section>

    <section id="join" class="join">
      <h2>Знакомство с участником</h2>
      <p>Учебная демонстрация. Данные никуда не отправляются.</p>
      <label for="visitor-name">Ваше имя</label>
      <input id="visitor-name" type="text" maxlength="40">
      <button id="join-button" class="button" type="button">
        Поприветствовать
      </button>
      <p id="message" role="status">Здесь появится сообщение.</p>
    </section>

  </main>

  <footer class="container">
    <p>Учебный проект. Автор: Кабан Кабаныч.</p>
  </footer>

</body>
</html>
